# Dùng cho Coolify (build pack: Docker Compose) hoặc chạy local: docker compose up -d
services:
  pccc:
    build: .
    container_name: pccc-app
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DATA_DIR=/data
    ports:
      - "3000:3000"
    volumes:
      - pccc-data:/data        # dữ liệu pccc_db.json lưu bền vững ở đây
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pccc-data:
